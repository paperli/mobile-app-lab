name: Deploy Hub Demo to Pages

# Builds the static prototypes and publishes them to GitHub Pages as one
# artifact: the hub-layout demo (packages/tv) at the site root, and the
# Lightning/Blits onboarding (packages/onboarding) at /onboarding/.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main, gh-pages]
    paths:
      - 'packages/tv/**'
      - 'packages/onboarding/**'
      - 'packages/ui-weekend/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-hub-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Shared package compiles to dist and must be built before the TV app.
      # build:pages chains shared -> tv demo -> onboarding; the onboarding
      # build writes into the TV demo's output, so the order matters.
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/tv/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
