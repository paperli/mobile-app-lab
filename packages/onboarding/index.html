<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weekend · TV Onboarding</title>
    <meta
      name="description"
      content="TV-first Weekend onboarding built with Lightning 3 and Blits, with a legacy browser build and performance diagnostics."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0322'/%3E%3Cpath d='m10 18 10 29 12-23 12 23 10-29' fill='none' stroke='%23ffda0a' stroke-width='6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="tv">
      <div id="app"></div>
      <video id="ident" playsinline preload="metadata" poster="assets/ident-final.jpg">
        <source src="assets/weekend-ident.mp4" type="video/mp4" />
      </video>
      <div id="caption" hidden></div>
    </div>
    <div id="boot" role="status">Opening Weekend…</div>
    <nav id="tools">
      <span>LIGHTNING · ONBOARDING</span>
      <button id="phoneToggle">Phone Simulator</button>
      <button id="controlsToggle">Prototype Controls</button>
      <button id="resetTop">↻ Restart</button>
      <button id="soundTop">Sound On</button>
      <button id="fullTop">Full Screen</button>
      <!-- Href is set from hub-link.js so dev and Pages both resolve. -->
      <a id="hubLink" href="../">Game Hub →</a>
    </nav>
    <aside id="controls" hidden></aside>
    <!-- The phone simulator mounts itself (see @weekend/ui/device). -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
